backend:
  name: git-gateway
  branch: main

# GitHub Pages 커스텀 도메인이 정해지면 실제 도메인으로 교체 (미리보기 링크 생성에 사용됨)
site_url: https://example.com
publish_mode: simple

collections:
  - name: "repair_history"
    label: "수리 이력"
    label_singular: "수리 이력 항목"
    folder: "src/content/works"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    identifier_field: title
    summary: "{{title}} — {{locationRegion}} ({{workedAt}})"
    fields:
      - { label: "제목", name: "title", widget: "string", hint: "예: 대덕동 단독주택 보일러 교체" }
      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - { label: "보일러 시공 및 A/S", value: "boiler" }
          - { label: "난방 배관공사", value: "heating" }
          - { label: "상하수도 배관공사", value: "water-pipe" }
          - { label: "누수 탐지", value: "leak-detection" }
          - { label: "해빙", value: "thawing" }
          - { label: "주택 리모델링", value: "remodeling" }
          - { label: "조립식 건축", value: "prefab" }
          - { label: "코어작업", value: "coring" }
      - { label: "시공 날짜", name: "workedAt", widget: "date" }
      - { label: "지역", name: "locationRegion", widget: "string", hint: "동/읍/면 정도까지만. 예: 당진시 대덕동" }
      - { label: "대표 사진", name: "coverImage", widget: "image" }
      - label: "추가 사진"
        name: "photos"
        widget: "list"
        required: false
        field: { label: "사진", name: "photo", widget: "image" }
      - { label: "설명", name: "body", widget: "markdown", required: false }
      - label: "임시저장(사이트에 아직 공개 안 함)"
        name: "draft"
        widget: "boolean"
        default: false

  - name: "site_settings"
    label: "사이트 설정"
    editor:
      preview: false
    files:
      - name: "config"
        label: "기본 정보"
        file: "src/content/site/config.json"
        fields:
          - { label: "상호명", name: "companyName", widget: "string" }
          - { label: "대표자", name: "ceoName", widget: "string" }
          - { label: "슬로건", name: "tagline", widget: "string" }
          - { label: "창업연도", name: "establishedYear", widget: "number" }
          - label: "누적 시공 건수 보정값"
            name: "baselineProjectCount"
            widget: "number"
            hint: "수리 이력에 등록한 건수 외에, 실제로는 더 많이 시공했다면 그 차이만큼 보정값으로 입력"
          - { label: "전화(유선)", name: "phone", widget: "string" }
          - { label: "휴대폰", name: "mobile", widget: "string" }
          - { label: "팩스", name: "fax", widget: "string" }
          - { label: "이메일", name: "email", widget: "string" }
          - { label: "주소", name: "address", widget: "string" }
          - { label: "영업시간", name: "businessHours", widget: "string" }
          - label: "사업자등록번호"
            name: "businessRegistrationNumber"
            widget: "string"
            required: false
          - label: "등록업체"
            name: "registrations"
            widget: "list"
          - label: "카카오톡 채널 링크"
            name: "kakaoChannelUrl"
            widget: "string"
            required: false
            hint: "카카오톡 채널 관리자센터 > 채팅 탭 > 채팅 링크 복사해서 붙여넣기. 비워두면 사이트에는 전화 문의 버튼이 대신 표시됩니다."
